services:
  - type: web
    name: eduscholar-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: USE_MYSQL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
